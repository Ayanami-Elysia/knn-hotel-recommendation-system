{# templates/user/profile.html #}
{% extends "base.html" %}
{% block title %}个人中心{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h4 class="card-title mb-4">👤 个人中心</h4>
                <form method="post" enctype="multipart/form-data">
                    <div class="text-center mb-3">
                        <img src="{{ current_user.avatar or url_for('static', filename='images/default-avatar.svg') }}"
                             class="rounded-circle border" style="width: 100px; height: 100px; object-fit: cover;"
                             alt="头像" id="avatarPreview">
                        <div class="mt-2">
                            <label class="btn btn-sm btn-outline-secondary">
                                📷 更换头像
                                <input type="file" name="avatar" accept="image/*" style="display:none" onchange="previewAvatar(event)">
                            </label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">真实姓名</label>
                        <input type="text" name="real_name" class="form-control" value="{{ current_user.real_name or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">手机号</label>
                        <input type="text" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
                    </div>
                    <button type="submit" class="btn btn-primary">保存修改</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function previewAvatar(e) {
    var reader = new FileReader();
    reader.onload = function(ev) {
        document.getElementById('avatarPreview').src = ev.target.result;
    };
    reader.readAsDataURL(e.target.files[0]);
}
</script>
{% endblock %}

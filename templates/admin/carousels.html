{% extends "base.html" %}
{% block title %}轮播图管理{% endblock %}
{% block content %}
<h4>🖼️ 轮播图管理</h4>
<button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addModal">+ 新增轮播图</button>
<table class="table table-striped">
    <thead><tr><th>ID</th><th>标题</th><th>图片URL</th><th>链接</th><th>排序</th><th>操作</th></tr></thead>
    <tbody>
        {% for c in carousels %}
        <tr>
            <td>{{ c.id }}</td><td>{{ c.title }}</td><td>{{ c.image_url }}</td><td>{{ c.link_url }}</td><td>{{ c.sort_order }}</td>
            <td>
                <form action="{{ url_for('admin.carousel_delete', cid=c.id) }}" method="post" class="d-inline" onsubmit="return confirm('确认删除?')"><button class="btn btn-sm btn-danger">删除</button></form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<form action="{{ url_for('admin.carousel_add') }}" method="post" class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5>新增轮播图</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <div class="mb-3"><label>标题</label><input type="text" name="title" class="form-control" required></div>
            <div class="mb-3"><label>图片URL</label><input type="text" name="image_url" class="form-control" required></div>
            <div class="mb-3"><label>链接URL</label><input type="text" name="link_url" class="form-control"></div>
            <div class="mb-3"><label>排序</label><input type="number" name="sort_order" class="form-control" value="0"></div>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-primary">保存</button></div>
    </div></div>
</form>
{% endblock %}

{% extends "base.html" %}
{% block title %}系统配置{% endblock %}
{% block content %}
<h4>⚙️ 系统配置</h4>
<div class="row">
    <div class="col-md-8">
        <form method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">关于我们</label>
                <textarea name="about_us" class="form-control" rows="5">{{ about_us }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">系统简介</label>
                <textarea name="system_intro" class="form-control" rows="5">{{ system_intro }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">保存配置</button>
        </form>
    </div>
</div>
{% endblock %}
